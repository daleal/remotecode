display_information:
  name: RemoteCode
  description: Run OpenCode from tagged Slack threads
features:
  bot_user:
    display_name: RemoteCode
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - groups:history
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  socket_mode_enabled: true
  token_rotation_enabled: false
